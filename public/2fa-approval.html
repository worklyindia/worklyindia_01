<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Verification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .success-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .error-bg {
      background: #f5f5f5;
    }
    .card {
      text-align: center;
      padding: 40px 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 340px;
      width: 100%;
    }
    .icon {
      font-size: 72px;
      margin-bottom: 20px;
      line-height: 1;
    }
    .title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .success-title {
      color: #059669;
    }
    .error-title {
      color: #dc2626;
    }
    .message {
      color: #666;
      font-size: 16px;
      line-height: 1.5;
    }
    .countdown {
      margin-top: 16px;
      color: #888;
      font-size: 14px;
    }
    .redirect-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .redirect-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .close-hint {
      margin-top: 16px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon">&#9989;</div>
    <h1 class="title success-title" id="title">Login Approved!</h1>
    <p class="message" id="message">Your login has been successfully verified.</p>
    <p class="countdown" id="countdown"></p>
    <a href="#" class="redirect-btn" id="redirectBtn" style="display: none;">Continue to Workly India</a>
    <p class="close-hint" id="closeHint">You can close this window now.</p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var status = params.get('status') || 'success';
      var userType = params.get('type') || 'job_seeker';
      
      var body = document.body;
      var icon = document.getElementById('icon');
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var countdown = document.getElementById('countdown');
      var redirectBtn = document.getElementById('redirectBtn');
      var closeHint = document.getElementById('closeHint');

      // Determine redirect URL based on user type
      var baseUrl = 'https://worklyindia.devs.surf';
      var redirectUrl = userType === 'employer' || userType === 'e' 
        ? baseUrl + '/employer-portal' 
        : baseUrl;

      var configs = {
        success: {
          bg: 'success-bg',
          icon: '&#9989;',
          titleClass: 'success-title',
          title: 'Login Approved!',
          message: 'Your login has been successfully verified.',
          showRedirect: true
        },
        expired: {
          bg: 'error-bg',
          icon: '&#10060;',
          titleClass: 'error-title',
          title: 'Link Expired',
          message: 'This verification link has expired. Please request a new one.',
          showRedirect: false
        },
        invalid: {
          bg: 'error-bg',
          icon: '&#10060;',
          titleClass: 'error-title',
          title: 'Invalid Link',
          message: 'This verification link is not valid.',
          showRedirect: false
        },
        error: {
          bg: 'error-bg',
          icon: '&#10060;',
          titleClass: 'error-title',
          title: 'Verification Failed',
          message: 'No active login session found or already verified.',
          showRedirect: false
        }
      };

      var config = configs[status] || configs.error;

      body.className = config.bg;
      icon.innerHTML = config.icon;
      title.className = 'title ' + config.titleClass;
      title.textContent = config.title;
      message.textContent = config.message;

      // Show redirect button and countdown for success
      if (config.showRedirect) {
        redirectBtn.href = redirectUrl;
        redirectBtn.style.display = 'inline-block';
        closeHint.textContent = 'or close this window now';

        // Auto-redirect countdown
        var secondsLeft = 3;
        countdown.textContent = 'Redirecting in ' + secondsLeft + ' seconds...';

        var timer = setInterval(function() {
          secondsLeft--;
          if (secondsLeft > 0) {
            countdown.textContent = 'Redirecting in ' + secondsLeft + ' seconds...';
          } else {
            clearInterval(timer);
            countdown.textContent = 'Redirecting...';
            window.location.href = redirectUrl;
          }
        }, 1000);
      } else {
        countdown.style.display = 'none';
        redirectBtn.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
