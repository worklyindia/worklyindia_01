    <script>
      // Apply the user's saved website theme before first paint to avoid a flash,
      // and keep the browser chrome (theme-color / color-scheme) in sync with it.
      // This forces the Chrome address bar to follow the website toggle, not the
      // phone's system dark mode.
      (function () {
        var STORAGE_KEY = 'workly-theme';
        var LIGHT_COLOR = '#f7f9fb';
        var DARK_COLOR = '#010816';

        function getTheme() {
          try {
            var stored = window.localStorage.getItem(STORAGE_KEY);
            if (stored === 'dark' || stored === 'light') return stored;
          } catch (e) {}
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function setMeta(name, content) {
          var metas = document.querySelectorAll('meta[name="' + name + '"]');
          if (!metas || metas.length === 0) {
            var m = document.createElement('meta');
            m.setAttribute('name', name);
            document.head.appendChild(m);
            metas = [m];
          }
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', content);
          }
        }

        function applyTheme() {
          var theme = getTheme();
          var dark = theme === 'dark';
          var color = dark ? DARK_COLOR : LIGHT_COLOR;

          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = theme;
          document.documentElement.style.setProperty('--app-shell-bg', color);
          document.documentElement.style.backgroundColor = color;

          setMeta('theme-color', color);
          setMeta('color-scheme', theme);

          function paintBody() {
            if (document.body) document.body.style.backgroundColor = color;
          }
          paintBody();
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', paintBody);
          }
        }

        applyTheme();

        // React (useTheme) updates same-tab state directly; this handles
        // cross-tab toggles and any late reads of the meta tags.
        try {
          window.addEventListener('storage', function (e) {
            if (e.key === STORAGE_KEY) {
              applyTheme();
            }
          });
        } catch (e) {}
      })();
    </script>
