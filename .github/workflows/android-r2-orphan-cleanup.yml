name: Android R2 automatic old APK cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-r2-orphan-cleanup.yml'
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-r2-orphan-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep public and latest APK; remove older unpublished releases automatically
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: workly-android-releases
        run: |
          set -euo pipefail
          python -m pip install --quiet requests boto3
          python - <<'PY'
          import os
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urlparse
          import boto3
          import requests

          base = os.environ["SUPABASE_URL"].rstrip("/")
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          account_id = os.environ["R2_ACCOUNT_ID"]
          access_key = os.environ["R2_ACCESS_KEY_ID"]
          secret_key = os.environ["R2_SECRET_ACCESS_KEY"]
          bucket = os.environ.get("R2_BUCKET", "workly-android-releases")
          if not all([base, service_key, account_id, access_key, secret_key]):
              raise SystemExit("Missing required Supabase or Cloudflare R2 secrets; refusing cleanup.")

          headers = {
              "apikey": service_key,
              "Authorization": f"Bearer {service_key}",
              "Content-Type": "application/json",
              "Prefer": "return=representation",
          }
          response = requests.get(
              f"{base}/rest/v1/android_app_releases",
              headers=headers,
              params={"select": "id,apk_path,is_published,version_code,created_at", "limit": "10000"},
              timeout=45,
          )
          response.raise_for_status()
          rows = response.json()
          if not isinstance(rows, list):
              raise SystemExit("Supabase release query did not return a list. Refusing cleanup.")

          # Protect every public release and the newest uploaded release, even if it is still unpublished.
          latest = max(rows, key=lambda row: (int(row.get("version_code") or 0), row.get("created_at") or ""), default=None)
          protected_ids = {row["id"] for row in rows if row.get("is_published") and row.get("id")}
          if latest and latest.get("id"):
              protected_ids.add(latest["id"])

          # Remove old unpublished release metadata automatically. Never delete a public or latest row.
          old_rows = [row for row in rows if row.get("id") and row["id"] not in protected_ids and not row.get("is_published")]
          removed_rows = 0
          for row in old_rows:
              delete_response = requests.delete(
                  f"{base}/rest/v1/android_app_releases",
                  headers=headers,
                  params={"id": f"eq.{row['id']}", "is_published": "eq.false"},
                  timeout=45,
              )
              delete_response.raise_for_status()
              removed_rows += len(delete_response.json() or [])

          protected = [row for row in rows if row.get("id") in protected_ids]
          referenced = set()
          for row in protected:
              value = row.get("apk_path") or ""
              parsed = urlparse(value)
              if parsed.scheme == "https" and parsed.hostname == "pub-e8cec40741a24d08bc49bd0c7070f8f3.r2.dev":
                  key = parsed.path.lstrip("/")
                  if key.startswith("android/releases/") and key.endswith("/Workly-India.apk"):
                      referenced.add(key)

          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{account_id}.r2.cloudflarestorage.com",
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name="auto",
          )

          # A one-hour grace period protects a just-uploaded APK while release metadata is being saved.
          cutoff = datetime.now(timezone.utc) - timedelta(hours=1)
          paginator = s3.get_paginator("list_objects_v2")
          candidates = []
          total = 0
          for page in paginator.paginate(Bucket=bucket, Prefix="android/releases/"):
              for obj in page.get("Contents", []):
                  key = obj["Key"]
                  if not key.endswith("/Workly-India.apk") or key in referenced:
                      continue
                  if obj["LastModified"] > cutoff:
                      continue
                  candidates.append({"Key": key})
                  total += int(obj.get("Size", 0))

          deleted = 0
          for offset in range(0, len(candidates), 1000):
              batch = candidates[offset:offset + 1000]
              result = s3.delete_objects(Bucket=bucket, Delete={"Objects": batch, "Quiet": False})
              errors = result.get("Errors", [])
              if errors:
                  raise SystemExit(f"R2 returned delete errors: {errors[:5]}")
              deleted += len(result.get("Deleted", []))

          print(f"Total release rows read: {len(rows)}")
          print(f"Public/latest release rows protected: {len(protected_ids)}")
          print(f"Older unpublished release rows deleted: {removed_rows}")
          print(f"Protected R2 APK objects: {len(referenced)}")
          print(f"Old unprotected APK objects deleted: {deleted}")
          print(f"Reclaimed bytes: {total}")
          PY
