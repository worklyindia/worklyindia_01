name: Android Public Release Retention

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workly-android-public-release-retention
  cancel-in-progress: false

jobs:
  cleanup-public-releases:
    runs-on: ubuntu-24.04
    steps:
      - name: Clean older Android releases only after a newer release is Public
        env:
          SUPABASE_URL: https://jubwzelupbntbetpajqb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: "07937ccf8d5c6398c657c170018f8f80"
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: workly-android-releases
        run: |
          set -euo pipefail
          python -m pip install --quiet requests boto3
          python - <<'PY'
          import os
          import re
          import requests
          import boto3
          from botocore.config import Config

          base = os.environ["SUPABASE_URL"].rstrip("/")
          service_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").strip()
          access_key = os.environ.get("R2_ACCESS_KEY_ID", "").strip()
          secret_key = os.environ.get("R2_SECRET_ACCESS_KEY", "").strip()
          account_id = os.environ.get("R2_ACCOUNT_ID", "").strip()
          bucket = os.environ.get("R2_BUCKET", "").strip()
          missing = [name for name, value in {
              "SUPABASE_SERVICE_ROLE_KEY": service_key,
              "R2_ACCESS_KEY_ID": access_key,
              "R2_SECRET_ACCESS_KEY": secret_key,
              "R2_ACCOUNT_ID": account_id,
              "R2_BUCKET": bucket,
          }.items() if not value]
          if missing:
              raise SystemExit("Missing required GitHub Actions secret/config: " + ", ".join(missing))

          headers = {
              "apikey": service_key,
              "Authorization": f"Bearer {service_key}",
              "Content-Type": "application/json",
          }
          response = requests.get(
              f"{base}/rest/v1/android_app_releases",
              headers=headers,
              params={
                  "select": "id,version_code,version_name,apk_path,is_published",
                  "is_published": "eq.true",
                  "order": "version_code.desc",
                  "limit": "10000",
              },
              timeout=45,
          )
          response.raise_for_status()
          public_rows = response.json()
          if not isinstance(public_rows, list):
              raise SystemExit("Supabase public release query did not return a list; refusing cleanup.")
          if not public_rows:
              print("No Public Android release exists. No R2 objects or database rows were deleted.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("## Android retention cleanup\n\nNo Public release found; nothing deleted.\n")
              raise SystemExit(0)

          # The highest-version Public release is the retention anchor.
          current = max(public_rows, key=lambda row: int(row.get("version_code") or 0))
          current_code = int(current["version_code"])
          current_id = current["id"]
          print(f"Verified Public retention anchor: v{current.get('version_name')} (versionCode {current_code}, id {current_id})")

          # Only release APKs under this dedicated prefix and matching the known
          # android-v<versionCode> naming convention can be deleted from R2.
          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{account_id}.r2.cloudflarestorage.com",
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name="auto",
              config=Config(signature_version="s3v4"),
          )
          stale_objects = []
          reclaimed_bytes = 0
          scanned_apks = 0
          pattern = re.compile(r"^android/releases/android-v(\\d+)/Workly-India\\.apk$")
          for page in s3.get_paginator("list_objects_v2").paginate(Bucket=bucket, Prefix="android/releases/"):
              for obj in page.get("Contents", []):
                  key = obj["Key"]
                  match = pattern.fullmatch(key)
                  if not match:
                      continue
                  scanned_apks += 1
                  if int(match.group(1)) < current_code:
                      stale_objects.append({"Key": key})
                      reclaimed_bytes += int(obj.get("Size", 0))

          deleted_objects = 0
          for offset in range(0, len(stale_objects), 1000):
              result = s3.delete_objects(
                  Bucket=bucket,
                  Delete={"Objects": stale_objects[offset:offset + 1000], "Quiet": False},
              )
              errors = result.get("Errors", [])
              if errors:
                  raise SystemExit("R2 deletion errors; Supabase rows were retained for retry: " + str(errors[:5]))
              deleted_objects += len(result.get("Deleted", []))

          # Delete every older DB release, regardless of its former published
          # state. Keep the Public anchor and all future drafts (higher versionCode).
          deleted_rows = 0
          while True:
              older = requests.get(
                  f"{base}/rest/v1/android_app_releases",
                  headers=headers,
                  params={
                      "select": "id,version_code",
                      "version_code": f"lt.{current_code}",
                      "limit": "500",
                  },
                  timeout=45,
              )
              older.raise_for_status()
              rows = older.json()
              if not rows:
                  break
              for row in rows:
                  result = requests.delete(
                      f"{base}/rest/v1/android_app_releases",
                      headers={**headers, "Prefer": "return=representation"},
                      params={"id": f"eq.{row['id']}", "version_code": f"lt.{current_code}"},
                      timeout=45,
                  )
                  result.raise_for_status()
                  try:
                      deleted_rows += len(result.json() or [])
                  except ValueError:
                      pass

          verify = requests.get(
              f"{base}/rest/v1/android_app_releases",
              headers=headers,
              params={"select": "id,version_code,is_published", "order": "version_code.desc", "limit": "10000"},
              timeout=45,
          )
          verify.raise_for_status()
          remaining = verify.json()
          if not any(row.get("id") == current_id and row.get("is_published") is True for row in remaining):
              raise SystemExit("Safety verification failed: Public retention anchor is missing after cleanup.")
          if any(int(row.get("version_code") or 0) < current_code for row in remaining):
              raise SystemExit("Cleanup verification failed: older Supabase release rows remain.")

          remaining_apks = 0
          for page in s3.get_paginator("list_objects_v2").paginate(Bucket=bucket, Prefix="android/releases/"):
              remaining_apks += sum(1 for obj in page.get("Contents", []) if pattern.fullmatch(obj["Key"]))

          report = [
              "## Android Public Release Cleanup",
              "",
              f"- Public release protected: **v{current.get('version_name')} / {current_code}**",
              f"- Older Supabase release rows deleted: **{deleted_rows}**",
              f"- Older R2 APK objects deleted: **{deleted_objects}**",
              f"- R2 APK objects scanned: **{scanned_apks}**",
              f"- R2 APK objects remaining: **{remaining_apks}**",
              f"- R2 storage reclaimed: **{reclaimed_bytes:,} bytes**",
              "- Future draft releases were preserved.",
              "- Cleanup runs only after a Public release is verified.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\\n".join(report) + "\\n")
          print("\\n".join(report))
          PY
