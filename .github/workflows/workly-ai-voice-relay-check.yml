name: Workly AI Voice Relay Checks

on:
  push:
    branches: [feature/workly-ai-voice-server-app]
    paths:
      - "supabase/functions/workly-ai-voice-relay/**"
      - "supabase/migrations/*workly_ai_voice_relay*"
      - ".github/workflows/workly-ai-voice-relay-check.yml"
  pull_request:
    paths:
      - "supabase/functions/workly-ai-voice-relay/**"
      - "supabase/migrations/*workly_ai_voice_relay*"
      - ".github/workflows/workly-ai-voice-relay-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Deno formatting
        run: deno fmt supabase/functions/workly-ai-voice-relay/index.ts
      - name: Type-check Edge Function
        run: deno check supabase/functions/workly-ai-voice-relay/index.ts
