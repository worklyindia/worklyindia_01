name: ChatWork Android Emulator Test

on:
  push:
    branches:
      - main
      - feature/chatwork-chat-page-messenger-ui
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/chatwork-emulator-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/chatwork-emulator-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatwork-emulator-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-emulator-smoke:
    name: Build APK and test on Android Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          echo "Runner architecture: $(uname -m)"
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          TOOLS_ZIP="$RUNNER_TEMP/commandlinetools-linux.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" -o "$TOOLS_ZIP"
          mkdir -p "$RUNNER_TEMP/android-cmdline-tools"
          unzip -q "$TOOLS_ZIP" -d "$RUNNER_TEMP/android-cmdline-tools"
          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail

      - name: Install Android and native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler unzip curl
          PROTOC_ZIP="$RUNNER_TEMP/protoc-36.2-linux-x86_64.zip"
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip" -o "$PROTOC_ZIP"
          echo "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278  $PROTOC_ZIP" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/protoc-36.2"
          unzip -q "$PROTOC_ZIP" -d "$RUNNER_TEMP/protoc-36.2"
          echo "$RUNNER_TEMP/protoc-36.2/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/protoc-36.2/bin/protoc" --version | grep -Fx "libprotoc 36.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Prepare diagnostic evidence directory
        shell: bash
        run: mkdir -p "$GITHUB_WORKSPACE/chatwork-emulator-evidence"

      - name: Build ChatWork direct debug APK
        working-directory: android-ai-voice
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDirectDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/chatwork-emulator-evidence/gradle-build.log"

      - name: Verify APK and package metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android-ai-voice/app/build/outputs/apk/direct/debug/app-direct-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.worklyindia.chatwork'" "$RUNNER_TEMP/apk-badging.txt"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Upload APK for test evidence
        uses: actions/upload-artifact@v7
        with:
          name: chatwork-emulator-test-apk
          path: android-ai-voice/app/build/outputs/apk/direct/debug/app-direct-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Linux KVM permissions
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::GitHub runner does not expose /dev/kvm; hardware-accelerated Android Emulator is unavailable on this runner."
            exit 1
          fi
          echo "KVM device before permission setup:"
          ls -l /dev/kvm
          # GitHub-hosted runners may expose KVM to root/the kvm group but not
          # the unprivileged Actions user. This runner is ephemeral, so grant
          # read/write access for the emulator job only.
          sudo chmod a+rw /dev/kvm
          echo "KVM device after permission setup:"
          ls -l /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::KVM is present but remains inaccessible after permission setup."
            id
            exit 1
          fi
          echo "KVM read/write access verified for $(id -un)."

      - name: Run ChatWork on Android Emulator (ARM64 app compatibility)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disable-linux-hw-accel: false
          target: google_apis
          # Keep x86_64 AVD and require KVM; software emulation is disabled on hosted runners.
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            APK="$GITHUB_WORKSPACE/android-ai-voice/app/build/outputs/apk/direct/debug/app-direct-debug.apk"
            adb wait-for-device
            trap 'adb logcat -d -t 5000 > "$GITHUB_WORKSPACE/chatwork-emulator-evidence/chatwork-emulator-logcat.txt" 2>/dev/null || true' EXIT
            adb shell getprop sys.boot_completed | grep -q 1
            adb install -r "$APK"
            adb shell pm grant com.worklyindia.chatwork android.permission.RECORD_AUDIO || true
            adb shell pm grant com.worklyindia.chatwork android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.worklyindia.chatwork
            adb shell monkey -p com.worklyindia.chatwork -c android.intent.category.LAUNCHER 1
            sleep 25
            if ! adb shell pidof com.worklyindia.chatwork >/dev/null; then
              adb logcat -d -t 5000 > "$GITHUB_WORKSPACE/chatwork-emulator-evidence/chatwork-emulator-logcat.txt"
              echo "::error::ChatWork did not remain running after launch. See logcat artifact."
              exit 1
            fi
            adb shell screencap -p /sdcard/chatwork-home.png
            adb pull /sdcard/chatwork-home.png "$GITHUB_WORKSPACE/chatwork-emulator-evidence/chatwork-home.png"
            adb shell uiautomator dump /sdcard/chatwork-window.xml >/dev/null
            adb pull /sdcard/chatwork-window.xml "$GITHUB_WORKSPACE/chatwork-emulator-evidence/chatwork-window.xml"
            echo "ChatWork launch smoke test passed; screenshot and UI hierarchy captured."

      - name: Upload emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chatwork-emulator-evidence
          path: chatwork-emulator-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ChatWork Android Emulator Test"
            echo ""
            echo "- APK build: see preceding build and metadata verification steps."
            echo "- Emulator: Android API 35, x86_64 host with ARM64 ABI translation, Pixel 5 profile."
            echo "- Smoke coverage: install, launcher start, process-alive check, screenshot, UI hierarchy and logcat capture."
            echo "- This is an automated emulator smoke test; it does not replace physical-device checks for OEM-specific behaviour, microphone hardware, notifications or real model inference."
          } >> "$GITHUB_STEP_SUMMARY"
