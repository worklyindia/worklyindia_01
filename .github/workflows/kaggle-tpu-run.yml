name: Workly India Kaggle TPU Run (automatic)

on:
  push:
    branches:
      - feature/chatwork-chat-page-messenger-ui
    paths:
      - ".github/workflows/kaggle-tpu-run.yml"

permissions:
  contents: read

concurrency:
  group: workly-kaggle-tpu-execute
  cancel-in-progress: false

jobs:
  run-tpu:
    name: Publish and execute Qwen TPU test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Kaggle secrets
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_KERNEL_SLUG"
          echo "Kaggle secret names are present."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI and notebook tools
        run: python -m pip install --upgrade six kaggle nbformat

      - name: Build Kaggle notebook metadata
        working-directory: kaggle/workly-tpu
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import nbformat

          username = os.environ["KAGGLE_USERNAME"].strip()
          slug = os.environ["KAGGLE_KERNEL_SLUG"].strip()
          if not username or not slug or "/" in slug:
              raise SystemExit("Invalid Kaggle username or kernel slug.")
          source = Path("workly_tpu.py").read_text(encoding="utf-8")
          notebook = nbformat.v4.new_notebook(
              cells=[nbformat.v4.new_code_cell(source)],
              metadata={
                  "kernelspec": {"display_name": "Python 3", "language": "python", "name": "python3"},
                  "language_info": {"name": "python"}
              }
          )
          nbformat.validate(notebook)
          nbformat.write(notebook, "workly_tpu.ipynb")
          metadata = {
              "id": f"{username}/{slug}",
              "title": "Workly India TPU Lab",
              "code_file": "workly_tpu.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": False,
              "enable_internet": True,
              "machine_shape": "TpuV5E8",
              "dataset_sources": [],
              "kernel_sources": [],
              "competition_sources": [],
              "model_sources": []
          }
          Path("kernel-metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          print("Notebook validated; TPU execution will now be requested.")
          PY

      - name: Push notebook and request Kaggle TPU execution
        working-directory: kaggle/workly-tpu
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          max_attempts=9
          for attempt in $(seq 1 "$max_attempts"); do
            set +e
            push_output="$(kaggle kernels push --path . --timeout 32400 --accelerator TpuV5E8 2>&1)"
            push_status=$?
            set -e
            printf '%s\n' "$push_output"

            if [[ "$push_status" -eq 0 ]] && ! grep -Eiq 'Kernel push error|KernelWorkerStatus\.(ERROR|CANCELLED)' <<<"$push_output"; then
              if grep -Eiq 'Kernel version .* pushed|Kernel pushed|Kernel started|KernelWorkerStatus\.(QUEUED|RUNNING)' <<<"$push_output"; then
                accepted=true
                break
              fi
              echo "::error::Kaggle response did not confirm that a new TPU execution was accepted."
              exit 1
            fi

            if grep -Eiq 'Maximum batch TPU session count of 1 reached' <<<"$push_output"; then
              if [[ "$attempt" -lt "$max_attempts" ]]; then
                echo "::warning::Kaggle TPU session capacity is full (attempt $attempt/$max_attempts). Waiting 5 minutes before retrying."
                sleep 300
                continue
              fi
              echo "::error::Kaggle TPU capacity remained full after $max_attempts attempts. No TPU session was started."
              exit 1
            fi

            echo "::error::Kaggle rejected the TPU execution for a reason other than temporary session capacity."
            exit 1
          done

          if [[ "$accepted" != "true" ]]; then
            echo "::error::No new Kaggle TPU execution was accepted."
            exit 1
          fi

      - name: Wait for Kaggle execution and verify Qwen result
        if: success()
        working-directory: kaggle/workly-tpu
        env:
          KERNEL_REF: ${{ secrets.KAGGLE_USERNAME }}/${{ secrets.KAGGLE_KERNEL_SLUG }}
        run: |
          set -euo pipefail
          completed=false
          for attempt in $(seq 1 60); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "Kaggle status check $attempt/60: $status"
            if grep -Eiq '(^|[^A-Z])COMPLETE([^A-Z]|$)' <<<"$status"; then
              completed=true
              break
            fi
            if grep -Eiq 'ERROR|FAILED|CANCELLED' <<<"$status"; then
              echo "::error::Kaggle reported a failed TPU run."
              kaggle kernels logs "$KERNEL_REF" || true
              exit 1
            fi
            sleep 30
          done
          if [[ "$completed" != "true" ]]; then
            echo "::error::Timed out waiting for Kaggle TPU execution."
            kaggle kernels logs "$KERNEL_REF" || true
            exit 1
          fi
          kaggle kernels logs "$KERNEL_REF"
          mkdir -p ../../kaggle-tpu-output
          kaggle kernels output "$KERNEL_REF" --path ../../kaggle-tpu-output --force --file-pattern 'workly-tpu-result\.json$'
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("../../kaggle-tpu-output").rglob("workly-tpu-result.json"))
          if not files:
              raise SystemExit("TPU run completed but result JSON was not downloaded.")
          result = json.loads(files[0].read_text(encoding="utf-8"))
          print(json.dumps(result, indent=2))
          if result.get("status") != "TPU_SMOKE_TEST_PASSED":
              raise SystemExit("TPU smoke test did not pass.")
          if result.get("model_inference_status") != "QWEN_INFERENCE_PASSED":
              raise SystemExit("TPU hardware passed, but Qwen inference did not pass.")
          print("Verified: TPU smoke test and Qwen inference passed.")
          PY
