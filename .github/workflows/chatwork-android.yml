name: ChatWork Android

on:
  push:
    branches:
      - feature/workly-ai-voice-server-app
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/chatwork-android.yml"
  pull_request:
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/chatwork-android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build ChatWork APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and native build tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Build debug APK
        working-directory: android-ai-voice
        run: gradle --no-daemon assembleDebug

      - name: Prepare public release summary
        shell: bash
        run: |
          {
            echo "# ChatWork — Public Release Summary"
            echo
            echo "| Field | Details |"
            echo "|---|---|"
            echo "| **Version name** | 1.0.0 |"
            echo "| **Version code** | $GITHUB_RUN_NUMBER |"
            echo "| **Minimum supported version code** | 1 |"
            echo "| **Application ID** | `com.worklyindia.aivoice` |"
            echo
            echo "## Release notes"
            echo
            echo "ChatWork Android preview release. Includes Hindi, Indian English and Gujarati voice tools; on-device Qwen 2.5 3B AI chat (model downloaded separately); local Stable Diffusion 1.5 Q4 image generation (1.57 GB model downloaded separately, 512×512 CPU mode); Android TTS and optional Indic Tiny TTS speech packs; voice input with Android speech recognition and optional offline speech-model packs; and secure owner-phone relay controls."
            echo
            echo "## Important limitations"
            echo
            echo "- This is a **debug preview APK**, not a signed production release."
            echo "- Large AI and speech models are downloaded separately; they are not bundled in the APK."
            echo "- Gujarati speech output currently depends on the Android TTS engine."
            echo "- Local image generation requires a separate 1.57 GB model download and can be slow or memory-intensive on mid-range phones; physical-device testing is required."
            echo "- Offline recognition accuracy, device performance and battery behavior require physical-device testing."
            echo "- Website/Supabase relay source is review-only and has not been deployed to production."
            echo
            echo "## Download"
            echo
            echo "The `ChatWork-v1.0.0` APK artifact is attached to this workflow run after a successful build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK for download
        run: cp android-ai-voice/app/build/outputs/apk/debug/app-debug.apk android-ai-voice/app/build/outputs/apk/debug/ChatWork-v1.0.0.apk

      - name: Upload ChatWork APK
        uses: actions/upload-artifact@v7
        with:
          name: ChatWork-v1.0.0
          path: android-ai-voice/app/build/outputs/apk/debug/ChatWork-v1.0.0.apk
          if-no-files-found: error
          retention-days: 14
