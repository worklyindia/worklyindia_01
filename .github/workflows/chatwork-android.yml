name: ChatWork Android
# Rebuild native APK for website-matched ChatWork conversation UI.

on:
  push:
    branches:
      - main
      - feature/chatwork-chat-page-messenger-ui
      - feature/workly-ai-voice-server-app
      - feat/voice-settings-connection-call-history
      - fix/jarvis-crash-diagnostics
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/chatwork-android.yml"
  pull_request:
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/chatwork-android.yml"
  workflow_dispatch:

# Do not cancel a valid Android build when another commit is pushed.
# Each commit gets its own group so release APK/AAB artifacts can finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ChatWork update APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        id: setup-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and native build tools
        id: setup-android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK, CMake and host tokenizer tools
        id: install-native-tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler unzip curl
          # SentencePiece's pinned protobuf runtime is v36.2. APT on Ubuntu
          # 24.04 ships protoc 3.21, which generates incompatible C++ headers.
          PROTOC_ZIP="$RUNNER_TEMP/protoc-36.2-linux-x86_64.zip"
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip" -o "$PROTOC_ZIP"
          echo "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278  $PROTOC_ZIP" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/protoc-36.2"
          unzip -q "$PROTOC_ZIP" -d "$RUNNER_TEMP/protoc-36.2"
          echo "$RUNNER_TEMP/protoc-36.2/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/protoc-36.2/bin/protoc" --version | grep -Fx "libprotoc 36.2"

      - name: Set up Gradle
        id: setup-gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Check release signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKLY_VOICE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WORKLY_VOICE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORKLY_VOICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORKLY_VOICE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD" ] && [ -z "$KEY_ALIAS" ] && [ -z "$KEY_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release signing secrets are only partially configured. Add all four WORKLY_VOICE_* secrets."
            exit 1
          fi

      - name: Configure stable release signing
        id: configure-signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKLY_VOICE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WORKLY_VOICE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORKLY_VOICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORKLY_VOICE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workly-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workly-signing/chatwork-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/workly-signing/chatwork-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "WORKLY_VOICE_KEYSTORE_PATH=$RUNNER_TEMP/workly-signing/chatwork-release.jks"
            echo "WORKLY_VOICE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "WORKLY_VOICE_KEY_ALIAS=$KEY_ALIAS"
            echo "WORKLY_VOICE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed update APK
        id: build-release
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-ai-voice
        run: gradle --no-daemon assembleDirectRelease uploadCrashlyticsSymbolFileDirectRelease

      - name: Build preview APK (not update-compatible)
        id: build-preview
        if: steps.signing.outputs.enabled == 'false'
        working-directory: android-ai-voice
        run: gradle --no-daemon assembleDirectDebug

      - name: Build signed Google Play App Bundle
        id: build-playstore-bundle
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-ai-voice
        run: gradle --no-daemon bundlePlayStoreRelease uploadCrashlyticsSymbolFilePlayStoreRelease

      - name: Verify and rename Google Play App Bundle
        id: verify-playstore-bundle
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find android-ai-voice/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$AAB" && test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify "$AAB" >/dev/null
          TARGET="$(dirname "$AAB")/ChatWork-PlayStore-v1.0.$GITHUB_RUN_NUMBER.aab"
          mv "$AAB" "$TARGET"
          echo "PLAYSTORE_AAB_PATH=$TARGET" >> "$GITHUB_ENV"
          echo "Verified signed Play Store AAB: $TARGET ($(stat -c%s "$TARGET") bytes)"

      - name: Verify native TTS runtime dependencies
        id: verify-native-runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="android-ai-voice/app/build/outputs/apk/direct/release/app-direct-release.apk"
          if [ ! -f "$APK" ]; then APK="android-ai-voice/app/build/outputs/apk/direct/debug/app-direct-debug.apk"; fi
          test -f "$APK"
          NDK_READelf="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$NDK_READelf"
          mkdir -p "$RUNNER_TEMP/chatwork-apk-check"
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/chatwork-apk-check"
          QVAC="$RUNNER_TEMP/chatwork-apk-check/lib/arm64-v8a/libworkly_qvac_tts_jni.so"
          QWEN="$RUNNER_TEMP/chatwork-apk-check/lib/arm64-v8a/libqwen3_tts_jni.so"
          test -f "$QVAC" && test -f "$QWEN"
          if "$NDK_READelf" -d "$QVAC" | grep -q 'Shared library: \[libomp.so\]'; then
            echo '::error::QVAC TTS still depends on libomp.so, which is not provided by Android.'
            exit 1
          fi
          if "$NDK_READelf" -d "$QWEN" | grep -Eq 'Shared library: \[libggml(-base|-cpu)?\.so\]'; then
            echo '::error::Qwen JNI still dynamically links GGML; this can load an incompatible GGML from another engine.'
            exit 1
          fi
          echo 'Verified: QVAC has no libomp.so dependency and Qwen has no shared GGML dependency.'

      - name: Rename APK
        id: rename-apk
        shell: bash
        run: |
          if [ -f android-ai-voice/app/build/outputs/apk/direct/release/app-direct-release.apk ]; then
            cp android-ai-voice/app/build/outputs/apk/direct/release/app-direct-release.apk "android-ai-voice/app/build/outputs/apk/direct/release/ChatWork-v1.0.$GITHUB_RUN_NUMBER.apk"
            echo "APK_PATH=android-ai-voice/app/build/outputs/apk/direct/release/ChatWork-v1.0.$GITHUB_RUN_NUMBER.apk" >> "$GITHUB_ENV"
          else
            cp android-ai-voice/app/build/outputs/apk/direct/debug/app-direct-debug.apk "android-ai-voice/app/build/outputs/apk/direct/debug/ChatWork-preview-v1.0.$GITHUB_RUN_NUMBER.apk"
            echo "APK_PATH=android-ai-voice/app/build/outputs/apk/direct/debug/ChatWork-preview-v1.0.$GITHUB_RUN_NUMBER.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload signed ChatWork APK to Cloudflare R2 and save Owner draft
        id: publish-chatwork
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        env:
          SUPABASE_URL: https://jubwzelupbntbetpajqb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: "07937ccf8d5c6398c657c170018f8f80"
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: workly-android-releases
          R2_PUBLIC_BASE_URL: https://pub-e8cec40741a24d08bc49bd0c7070f8f3.r2.dev
          APK_FILE: android-ai-voice/app/build/outputs/apk/direct/release/ChatWork-v1.0.${{ github.run_number }}.apk
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          python -m pip install --quiet requests boto3
          python - <<'PY'
          import os, pathlib, requests, boto3
          from botocore.exceptions import ClientError

          base = os.environ["SUPABASE_URL"].rstrip("/")
          service = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip()
          account = os.environ["R2_ACCOUNT_ID"]
          access = os.environ["R2_ACCESS_KEY_ID"]
          secret = os.environ["R2_SECRET_ACCESS_KEY"]
          bucket = os.environ["R2_BUCKET"]
          public_base = os.environ["R2_PUBLIC_BASE_URL"].rstrip("/")
          apk = pathlib.Path(os.environ["APK_FILE"])
          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          notes = os.environ.get("RELEASE_NOTES", "")
          missing = [k for k,v in {"SUPABASE_SERVICE_ROLE_KEY":service,"R2_ACCESS_KEY_ID":access,"R2_SECRET_ACCESS_KEY":secret}.items() if not v]
          if missing: raise SystemExit("Missing required release secret(s): " + ", ".join(missing))
          if not apk.is_file() or apk.stat().st_size <= 0: raise SystemExit("Signed ChatWork APK missing; refusing to publish.")
          s3 = boto3.client("s3", endpoint_url=f"https://{account}.r2.cloudflarestorage.com", aws_access_key_id=access, aws_secret_access_key=secret, region_name="auto")
          key = f"chatwork/releases/chatwork-v{code}/ChatWork.apk"
          with apk.open("rb") as stream:
              s3.put_object(Bucket=bucket, Key=key, Body=stream, ContentLength=apk.stat().st_size, ContentType="application/vnd.android.package-archive", CacheControl="public, max-age=31536000, immutable", Metadata={"version-code":str(code),"version-name":name})
          head = s3.head_object(Bucket=bucket, Key=key)
          if int(head.get("ContentLength",-1)) != apk.stat().st_size: raise SystemExit("R2 upload size verification failed.")
          url = f"{public_base}/{key}"
          probe = requests.head(url, allow_redirects=True, timeout=45)
          if probe.status_code != 200: raise SystemExit(f"Public APK URL check failed: HTTP {probe.status_code}")
          headers = {"apikey":service,"Authorization":f"Bearer {service}"}
          row = {"version_code":code,"version_name":name,"apk_path":url,"apk_size_bytes":apk.stat().st_size,"release_notes":notes,"min_supported_version_code":1,"is_published":False,"published_at":None}
          lookup = requests.get(f"{base}/rest/v1/chatwork_app_releases",headers=headers,params={"select":"id","version_code":f"eq.{code}","limit":"1"},timeout=30)
          lookup.raise_for_status()
          existing = lookup.json()
          if existing:
              saved = requests.patch(f"{base}/rest/v1/chatwork_app_releases",headers={**headers,"Content-Type":"application/json"},params={"id":f"eq.{existing[0]['id']}"},json=row,timeout=30)
          else:
              saved = requests.post(f"{base}/rest/v1/chatwork_app_releases",headers={**headers,"Content-Type":"application/json","Prefer":"return=representation"},json=row,timeout=30)
          if saved.status_code not in (200,201,204): raise SystemExit(f"Supabase ChatWork draft save failed: {saved.status_code} {saved.text[:500]}")
          check = requests.get(f"{base}/rest/v1/chatwork_app_releases",headers=headers,params={"select":"id,version_code,version_name,apk_path,apk_size_bytes,is_published","version_code":f"eq.{code}","limit":"1"},timeout=30)
          check.raise_for_status()
          drafts = check.json()
          if len(drafts)!=1 or int(drafts[0]["version_code"])!=code or drafts[0]["apk_path"]!=url or int(drafts[0]["apk_size_bytes"])!=apk.stat().st_size or drafts[0]["is_published"]:
              raise SystemExit("ChatWork draft read-back verification failed; retention is blocked.")
          public_response = requests.get(f"{base}/rest/v1/chatwork_app_releases",headers=headers,params={"select":"id,version_code,version_name,apk_path,is_published","is_published":"eq.true","order":"version_code.desc","limit":"1"},timeout=30)
          public_response.raise_for_status()
          active_rows = public_response.json()
          active = active_rows[0] if active_rows else None
          keep = {code}
          if active:
              active_code = int(active["version_code"]); keep.add(active_code)
              active_key = f"chatwork/releases/chatwork-v{active_code}/ChatWork.apk"
              active_head = s3.head_object(Bucket=bucket,Key=active_key)
              active_probe = requests.head(active["apk_path"],allow_redirects=True,timeout=45)
              if active_probe.status_code!=200 or int(active_head.get("ContentLength",0))<=0:
                  raise SystemExit("Current Public ChatWork APK is not downloadable; refusing cleanup.")
          old_keys=[]
          paginator=s3.get_paginator("list_objects_v2")
          for page in paginator.paginate(Bucket=bucket,Prefix="chatwork/releases/"):
              for obj in page.get("Contents",[]):
                  parts=obj["Key"].split("/")
                  if len(parts)!=4 or parts[0]!="chatwork" or parts[1]!="releases" or parts[3]!="ChatWork.apk" or not parts[2].startswith("chatwork-v"): continue
                  try: old_code=int(parts[2][len("chatwork-v"):])
                  except (ValueError,IndexError): continue
                  if 0 < old_code < code and old_code not in keep: old_keys.append(obj["Key"])
          if old_keys:
              deleted=s3.delete_objects(Bucket=bucket,Delete={"Objects":[{"Key":k} for k in old_keys],"Quiet":False})
              if deleted.get("Errors"): raise SystemExit("Cloudflare ChatWork APK cleanup failed: "+str(deleted["Errors"][0]))
          params={"version_code":f"lt.{code}","select":"id,version_code"}
          if active: params["id"]=f"neq.{active['id']}"
          old_resp=requests.get(f"{base}/rest/v1/chatwork_app_releases",headers=headers,params=params,timeout=30)
          old_resp.raise_for_status()
          old_rows=old_resp.json()
          if old_rows:
              delete_params={"version_code":f"lt.{code}"}
              if active: delete_params["id"]=f"neq.{active['id']}"
              deleted_rows=requests.delete(f"{base}/rest/v1/chatwork_app_releases",headers={**headers,"Prefer":"return=representation"},params=delete_params,timeout=30)
              if deleted_rows.status_code not in (200,204): raise SystemExit("Supabase ChatWork retention cleanup failed: "+deleted_rows.text[:500])
          print(f"Verified ChatWork v{name} draft in Supabase; Cloudflare R2 object {key}; removed {len(old_keys)} older APK object(s).")
          PY


      - name: Upload ChatWork APK
        id: upload-chatwork-apk
        uses: actions/upload-artifact@v7
        with:
          name: ChatWork-v1.0.${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play App Bundle
        id: upload-playstore-aab
        if: success() && steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ChatWork-PlayStore-v1.0.${{ github.run_number }}
          path: ${{ env.PLAYSTORE_AAB_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish complete ChatWork workflow summary
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          ARTIFACT_URL: ${{ steps.upload-chatwork-apk.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload-chatwork-apk.outputs.artifact-id }}
          PLAYSTORE_BUNDLE_STATUS: ${{ steps.build-playstore-bundle.outcome }}
          PLAYSTORE_VERIFY_STATUS: ${{ steps.verify-playstore-bundle.outcome }}
          PLAYSTORE_ARTIFACT_STATUS: ${{ steps.upload-playstore-aab.outcome }}
          PLAYSTORE_ARTIFACT_URL: ${{ steps.upload-playstore-aab.outputs.artifact-url }}
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          JAVA_STATUS: ${{ steps.setup-java.outcome }}
          ANDROID_STATUS: ${{ steps.setup-android.outcome }}
          NATIVE_TOOLS_STATUS: ${{ steps.install-native-tools.outcome }}
          GRADLE_STATUS: ${{ steps.setup-gradle.outcome }}
          SIGNING_STATUS: ${{ steps.signing.outcome }}
          SIGNING_SETUP_STATUS: ${{ steps.configure-signing.outcome }}
          RELEASE_BUILD_STATUS: ${{ steps.build-release.outcome }}
          PREVIEW_BUILD_STATUS: ${{ steps.build-preview.outcome }}
          RUNTIME_VERIFY_STATUS: ${{ steps.verify-native-runtime.outcome }}
          RENAME_STATUS: ${{ steps.rename-apk.outcome }}
          PUBLISH_STATUS: ${{ steps.publish-chatwork.outcome }}
          ARTIFACT_STATUS: ${{ steps.upload-chatwork-apk.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          e = os.environ
          summary = Path(e["GITHUB_STEP_SUMMARY"])

          def val(key):
              return e.get(key) or "not run"

          def pretty(value):
              return {
                  "success": "Success",
                  "failure": "Failed",
                  "cancelled": "Cancelled",
                  "skipped": "Skipped",
                  "not run": "Not run",
              }.get(value, value)

          steps = [
              ("Checkout source", "CHECKOUT_STATUS"),
              ("Java 17 setup", "JAVA_STATUS"),
              ("Android SDK setup", "ANDROID_STATUS"),
              ("NDK / CMake / tokenizer tools", "NATIVE_TOOLS_STATUS"),
              ("Gradle setup", "GRADLE_STATUS"),
              ("Release signing configuration", "SIGNING_STATUS"),
              ("Configure signing key", "SIGNING_SETUP_STATUS"),
              ("Signed release APK build", "RELEASE_BUILD_STATUS"),
              ("Debug preview APK build", "PREVIEW_BUILD_STATUS"),
              ("Native TTS runtime verification", "RUNTIME_VERIFY_STATUS"),
              ("Rename APK", "RENAME_STATUS"),
              ("Cloudflare R2 + Supabase publishing", "PUBLISH_STATUS"),
              ("GitHub APK artifact upload", "ARTIFACT_STATUS"),
              ("Google Play AAB build", "PLAYSTORE_BUNDLE_STATUS"),
              ("Google Play AAB signature / archive verification", "PLAYSTORE_VERIFY_STATUS"),
              ("Google Play AAB artifact upload", "PLAYSTORE_ARTIFACT_STATUS"),
          ]
          failed = [(name, val(key)) for name, key in steps if val(key) == "failure"]
          skipped = [(name, val(key)) for name, key in steps if val(key) == "skipped"]
          production = e["REF_NAME"] == "main" and e["EVENT_NAME"] != "pull_request"
          signed = val("SIGNING_ENABLED") == "true"
          build_status = val("RELEASE_BUILD_STATUS") if signed else val("PREVIEW_BUILD_STATUS")
          lines = [
              "# ChatWork Android — complete workflow summary",
              "",
              "| Field | Result |",
              "|---|---|",
              "| App | ChatWork |",
              "| Application ID | com.worklyindia.chatwork |",
              f"| Version name | 1.0.{e['RUN_NUMBER']} |",
              f"| Version code | {e['RUN_NUMBER']} |",
              f"| Build type | {'Production main build' if production else 'PR / branch verification build'} |",
              f"| APK build | {pretty(build_status)} |",
              f"| Signing | {'Stable release key — update-compatible with installs signed by the same key' if signed else 'Debug key — preview only; cannot update a release-signed install'} |",
              f"| APK artifact | {'Uploaded — [Download artifact](' + e['ARTIFACT_URL'] + ')' if e.get('ARTIFACT_URL') else pretty(val('ARTIFACT_STATUS'))} |",
              f"| Artifact ID | {val('ARTIFACT_ID')} |",
              f"| Play Store AAB | {'Uploaded — [Download signed AAB](' + e['PLAYSTORE_ARTIFACT_URL'] + ')' if e.get('PLAYSTORE_ARTIFACT_URL') else pretty(val('PLAYSTORE_ARTIFACT_STATUS'))} |",
              f"| Cloudflare R2 + Supabase | {pretty(val('PUBLISH_STATUS')) if production and signed else 'Skipped — requires a signed build on main'} |",
              f"| Commit | {e['COMMIT_SHA']} |",
              "",
              "## Step-by-step status",
              "",
              "| Step | Status |",
              "|---|---|",
          ]
          lines += [f"| {name} | {pretty(val(key))} |" for name, key in steps]
          lines += ["", "## Error details", ""]
          if failed:
              run_url = f"https://github.com/{e['REPOSITORY']}/actions/runs/{e['RUN_ID']}/attempts/{e['RUN_ATTEMPT']}"
              lines += [f"- **{name}:** failed. [Open this run's logs]({run_url}) and expand the step for its exact error." for name, _ in failed]
          else:
              lines.append("- No failed steps were reported by GitHub Actions.")
          lines += ["", "## Skip details", ""]
          if skipped:
              lines += [f"- **{name}:** skipped by workflow conditions or because an earlier step failed." for name, _ in skipped]
          if not signed:
              lines.append("- **Signed APK / Play Store AAB:** signing secrets are not configured; only a debug preview APK is built.")
              lines.append("- **Play Store AAB:** skipped because Google Play requires a signed release bundle.")
          if not production:
              lines.append("- **Cloudflare R2 + Supabase production publishing:** intentionally runs only for signed builds on the main branch.")
          if not skipped and signed and production:
              lines.append("- No steps were skipped.")
          lines += [
              "",
              f"Workflow run: [#{e['RUN_ID']}](https://github.com/{e['REPOSITORY']}/actions/runs/{e['RUN_ID']}) · Attempt {e['RUN_ATTEMPT']}",
              "",
          ]
          with summary.open("a", encoding="utf-8") as out:
              out.write("\n".join(lines))
          PY

      - name: Append Workly-style ChatWork artifact and Gradle diagnostics
        if: always()
        shell: bash
        env:
          APK_PATH: ${{ env.APK_PATH }}
          AAB_PATH: ${{ env.PLAYSTORE_AAB_PATH }}
          APK_BUILD_STATUS: ${{ steps.build-release.outcome }}
          PREVIEW_BUILD_STATUS: ${{ steps.build-preview.outcome }}
          AAB_BUILD_STATUS: ${{ steps.build-playstore-bundle.outcome }}
          AAB_VERIFY_STATUS: ${{ steps.verify-playstore-bundle.outcome }}
          APK_UPLOAD_STATUS: ${{ steps.upload-chatwork-apk.outcome }}
          AAB_UPLOAD_STATUS: ${{ steps.upload-playstore-aab.outcome }}
          GRADLE_SETUP_STATUS: ${{ steps.setup-gradle.outcome }}
        run: |
          python - <<'PY'
          import os, hashlib
          from pathlib import Path
          from decimal import Decimal
          out = Path(os.environ['GITHUB_STEP_SUMMARY'])
          def info(key):
              raw = os.environ.get(key, '')
              p = Path(raw) if raw else None
              if not p or not p.is_file(): return None
              size = p.stat().st_size
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              return (p.name, size, size / 1_000_000, size / (1024 * 1024), digest)
          def status(key): return os.environ.get(key) or 'not run'
          apk, aab = info('APK_PATH'), info('AAB_PATH')
          lines = ['', '## ChatWork — APK / AAB exact artifact diagnostics', '', '| File | Exact size (bytes) | Decimal MB | Binary MiB | SHA-256 |', '|---|---:|---:|---:|---|']
          for label, item in [('APK', apk), ('Google Play AAB', aab)]:
              if item: lines.append(f'| {label} — {item[0]} | {item[1]:,} | {item[2]:.2f} MB | {item[3]:.2f} MiB | `{item[4]}` |')
              else: lines.append(f'| {label} | Not produced | — | — | — |')
          lines += ['', '## ChatWork — Gradle build diagnostics', '', '| Field | Result |', '|---|---|', '| Root project | WorklyIndia / ChatWork Android |', '| Gradle version | 9.5.1 |', '| Requested tasks | `assembleDirectRelease`, `bundlePlayStoreRelease` (unsigned PR preview: `assembleDirectDebug`) |', f"| Gradle setup | {status('GRADLE_SETUP_STATUS')} |", f"| Signed APK build | {status('APK_BUILD_STATUS')} |", f"| Preview APK build | {status('PREVIEW_BUILD_STATUS')} |", f"| Google Play AAB build | {status('AAB_BUILD_STATUS')} |", f"| AAB signature/archive verification | {status('AAB_VERIFY_STATUS')} |", f"| APK artifact upload | {status('APK_UPLOAD_STATUS')} |", f"| AAB artifact upload | {status('AAB_UPLOAD_STATUS')} |", '']
