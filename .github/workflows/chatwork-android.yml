name: ChatWork Android

on:
  push:
    branches:
      - main
      - feature/workly-ai-voice-server-app
      - feat/voice-settings-connection-call-history
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/chatwork-android.yml"
  pull_request:
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/chatwork-android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ChatWork update APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and native build tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK, CMake and host tokenizer tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler unzip curl
          # SentencePiece's pinned protobuf runtime is v36.2. APT on Ubuntu
          # 24.04 ships protoc 3.21, which generates incompatible C++ headers.
          PROTOC_ZIP="$RUNNER_TEMP/protoc-36.2-linux-x86_64.zip"
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip" -o "$PROTOC_ZIP"
          echo "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278  $PROTOC_ZIP" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/protoc-36.2"
          unzip -q "$PROTOC_ZIP" -d "$RUNNER_TEMP/protoc-36.2"
          echo "$RUNNER_TEMP/protoc-36.2/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/protoc-36.2/bin/protoc" --version | grep -Fx "libprotoc 36.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Check release signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKLY_VOICE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WORKLY_VOICE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORKLY_VOICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORKLY_VOICE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD" ] && [ -z "$KEY_ALIAS" ] && [ -z "$KEY_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release signing secrets are only partially configured. Add all four WORKLY_VOICE_* secrets."
            exit 1
          fi

      - name: Configure stable release signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKLY_VOICE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WORKLY_VOICE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORKLY_VOICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORKLY_VOICE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workly-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workly-signing/chatwork-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/workly-signing/chatwork-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "WORKLY_VOICE_KEYSTORE_PATH=$RUNNER_TEMP/workly-signing/chatwork-release.jks"
            echo "WORKLY_VOICE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "WORKLY_VOICE_KEY_ALIAS=$KEY_ALIAS"
            echo "WORKLY_VOICE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed update APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-ai-voice
        run: gradle --no-daemon assembleRelease

      - name: Build preview APK (not update-compatible)
        if: steps.signing.outputs.enabled == 'false'
        working-directory: android-ai-voice
        run: gradle --no-daemon assembleDebug

      - name: Verify native TTS runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          APK="android-ai-voice/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then APK="android-ai-voice/app/build/outputs/apk/debug/app-debug.apk"; fi
          test -f "$APK"
          NDK_READelf="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$NDK_READelf"
          mkdir -p "$RUNNER_TEMP/chatwork-apk-check"
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/chatwork-apk-check"
          QVAC="$RUNNER_TEMP/chatwork-apk-check/lib/arm64-v8a/libworkly_qvac_tts_jni.so"
          QWEN="$RUNNER_TEMP/chatwork-apk-check/lib/arm64-v8a/libqwen3_tts_jni.so"
          test -f "$QVAC" && test -f "$QWEN"
          if "$NDK_READelf" -d "$QVAC" | grep -q 'Shared library: \[libomp.so\]'; then
            echo '::error::QVAC TTS still depends on libomp.so, which is not provided by Android.'
            exit 1
          fi
          if "$NDK_READelf" -d "$QWEN" | grep -Eq 'Shared library: \[libggml(-base|-cpu)?\.so\]'; then
            echo '::error::Qwen JNI still dynamically links GGML; this can load an incompatible GGML from another engine.'
            exit 1
          fi
          echo 'Verified: QVAC has no libomp.so dependency and Qwen has no shared GGML dependency.'

      - name: Rename APK
        shell: bash
        run: |
          if [ -f android-ai-voice/app/build/outputs/apk/release/app-release.apk ]; then
            cp android-ai-voice/app/build/outputs/apk/release/app-release.apk "android-ai-voice/app/build/outputs/apk/release/ChatWork-v1.0.$GITHUB_RUN_NUMBER.apk"
            echo "APK_PATH=android-ai-voice/app/build/outputs/apk/release/ChatWork-v1.0.$GITHUB_RUN_NUMBER.apk" >> "$GITHUB_ENV"
          else
            cp android-ai-voice/app/build/outputs/apk/debug/app-debug.apk "android-ai-voice/app/build/outputs/apk/debug/ChatWork-preview-v1.0.$GITHUB_RUN_NUMBER.apk"
            echo "APK_PATH=android-ai-voice/app/build/outputs/apk/debug/ChatWork-preview-v1.0.$GITHUB_RUN_NUMBER.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload signed ChatWork APK to Cloudflare R2 and save Owner draft
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        env:
          SUPABASE_URL: https://jubwzelupbntbetpajqb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: "07937ccf8d5c6398c657c170018f8f80"
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: workly-android-releases
          R2_PUBLIC_BASE_URL: https://pub-e8cec40741a24d08bc49bd0c7070f8f3.r2.dev
          APK_FILE: ${{ env.APK_PATH }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          python -m pip install --quiet requests boto3
          python - <<'PY'
          import os, pathlib, requests, boto3
          from botocore.exceptions import ClientError

          base = os.environ["SUPABASE_URL"].rstrip("/")
          service = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip()
          account = os.environ["R2_ACCOUNT_ID"]
          access = os.environ["R2_ACCESS_KEY_ID"]
          secret = os.environ["R2_SECRET_ACCESS_KEY"]
          bucket = os.environ["R2_BUCKET"]
          public_base = os.environ["R2_PUBLIC_BASE_URL"].rstrip("/")
          apk = pathlib.Path(os.environ["APK_FILE"])
          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          notes = os.environ.get("RELEASE_NOTES", "")
          missing = [k for k,v in {"SUPABASE_SERVICE_ROLE_KEY":service,"R2_ACCESS_KEY_ID":access,"R2_SECRET_ACCESS_KEY":secret}.items() if not v]
          if missing: raise SystemExit("Missing required release secret(s): " + ", ".join(missing))
          if not apk.is_file() or apk.stat().st_size <= 0: raise SystemExit("Signed ChatWork APK missing; refusing to publish.")
          s3 = boto3.client("s3", endpoint_url=f"https://{account}.r2.cloudflarestorage.com", aws_access_key_id=access, aws_secret_access_key=secret, region_name="auto")
          key = f"chatwork/releases/chatwork-v{code}/ChatWork.apk"
          with apk.open("rb") as stream:
              s3.put_object(Bucket=bucket, Key=key, Body=stream, ContentLength=apk.stat().st_size, ContentType="application/vnd.android.package-archive", CacheControl="public, max-age=31536000, immutable", Metadata={"version-code":str(code),"version-name":name})
          head = s3.head_object(Bucket=bucket, Key=key)
          if int(head.get("ContentLength",-1)) != apk.stat().st_size: raise SystemExit("R2 upload size verification failed.")
          url = f"{public_base}/{key}"
          probe = requests.head(url, allow_redirects=True, timeout=45)
          if probe.status_code != 200: raise SystemExit(f"Public APK URL check failed: HTTP {probe.status_code}")
          headers = {"apikey":service,"Authorization":f"Bearer {service}"}
          row = {"version_code":code,"version_name":name,"apk_path":url,"apk_size_bytes":apk.stat().st_size,"release_notes":notes,"min_supported_version_code":1,"is_published":False,"published_at":None}
          lookup = requests.get(f"{base}/rest/v1/chatwork_app_releases",headers=headers,params={"select":"id","version_code":f"eq.{code}","limit":"1"},timeout=30)
          lookup.raise_for_status()
          existing = lookup.json()
          if existing:
              saved = requests.patch(f"{base}/rest/v1/chatwork_app_releases",headers={**headers,"Content-Type":"application/json"},params={"id":f"eq.{existing[0]['id']}"},json=row,timeout=30)
          else:
              saved = requests.post(f"{base}/rest/v1/chatwork_app_releases",headers={**headers,"Content-Type":"application/json","Prefer":"return=representation"},json=row,timeout=30)
          if saved.status_code not in (200,201,204): raise SystemExit(f"Supabase ChatWork draft save failed: {saved.status_code} {saved.text[:500]}")
          check = requests.get(f"{base}/rest/v1/chatwork_app_releases",headers=headers,params={"select":"id,version_code,version_name,apk_path,apk_size_bytes,is_published","version_code":f"eq.{code}","limit":"1"},timeout=30)
          check.raise_for_status()
          drafts = check.json()
          if len(drafts)!=1 or int(drafts[0]["version_code"])!=code or drafts[0]["apk_path"]!=url or int(drafts[0]["apk_size_bytes"])!=apk.stat().st_size or drafts[0]["is_published"]:
              raise SystemExit("ChatWork draft read-back verification failed; retention is blocked.")
          public_response = requests.get(f"{base}/rest/v1/chatwork_app_releases",headers=headers,params={"select":"id,version_code,version_name,apk_path,is_published","is_published":"eq.true","order":"version_code.desc","limit":"1"},timeout=30)
          public_response.raise_for_status()
          active_rows = public_response.json()
          active = active_rows[0] if active_rows else None
          keep = {code}
          if active:
              active_code = int(active["version_code"]); keep.add(active_code)
              active_key = f"chatwork/releases/chatwork-v{active_code}/ChatWork.apk"
              active_head = s3.head_object(Bucket=bucket,Key=active_key)
              active_probe = requests.head(active["apk_path"],allow_redirects=True,timeout=45)
              if active_probe.status_code!=200 or int(active_head.get("ContentLength",0))<=0:
                  raise SystemExit("Current Public ChatWork APK is not downloadable; refusing cleanup.")
          old_keys=[]
          paginator=s3.get_paginator("list_objects_v2")
          for page in paginator.paginate(Bucket=bucket,Prefix="chatwork/releases/"):
              for obj in page.get("Contents",[]):
                  parts=obj["Key"].split("/")
                  if len(parts)!=4 or parts[0]!="chatwork" or parts[1]!="releases" or parts[3]!="ChatWork.apk" or not parts[2].startswith("chatwork-v"): continue
                  try: old_code=int(parts[2"][len("chatwork-v"):])
                  except (ValueError,IndexError): continue
                  if 0 < old_code < code and old_code not in keep: old_keys.append(obj["Key"])
          if old_keys:
              deleted=s3.delete_objects(Bucket=bucket,Delete={"Objects":[{"Key":k} for k in old_keys],"Quiet":False})
              if deleted.get("Errors"): raise SystemExit("Cloudflare ChatWork APK cleanup failed: "+str(deleted["Errors"][0]))
          params={"version_code":f"lt.{code}","select":"id,version_code"}
          if active: params["id"]=f"neq.{active['id']}"
          old_resp=requests.get(f"{base}/rest/v1/chatwork_app_releases",headers=headers,params=params,timeout=30)
          old_resp.raise_for_status()
          old_rows=old_resp.json()
          if old_rows:
              delete_params={"version_code":f"lt.{code}"}
              if active: delete_params["id"]=f"neq.{active['id']}"
              deleted_rows=requests.delete(f"{base}/rest/v1/chatwork_app_releases",headers={**headers,"Prefer":"return=representation"},params=delete_params,timeout=30)
              if deleted_rows.status_code not in (200,204): raise SystemExit("Supabase ChatWork retention cleanup failed: "+deleted_rows.text[:500])
          print(f"Verified ChatWork v{name} draft in Supabase; Cloudflare R2 object {key}; removed {len(old_keys)} older APK object(s).")
          PY

      - name: Publish build summary
        shell: bash
        run: |
          echo "# ChatWork APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application ID: com.worklyindia.chatwork" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version code: $GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            echo "- Signing: stable release key (in-place update compatible with installs signed by this same key)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Signing: temporary debug key; this APK cannot safely update a release-signed install." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ChatWork APK
        uses: actions/upload-artifact@v7
        with:
          name: ChatWork-v1.0.${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
