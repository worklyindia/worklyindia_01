name: ChatWork AI Context Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/unified-voice/**"
      - "src/lib/ownerPhoneVoiceRelay.ts"
      - ".github/workflows/chatwork-ai-context-validation.yml"

jobs:
  deno-check:
    name: Check unified-voice Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function and local imports
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/unified-voice/index.ts
