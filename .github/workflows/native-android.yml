name: Native Android
# Rebuild the signed native app whenever Kotlin app/auth sources change.
# Includes mobile login, password recovery and native 2FA verification.

on:
  push:
    paths:
      - "native/android/**"
      - "android-release.properties"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate unique Android release version and metadata
        id: release-metadata
        env:
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("android-release.properties")
          values = {}
          for line in path.read_text().splitlines():
              if "=" in line and not line.lstrip().startswith("#"):
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()

          run_number = int(os.environ["WORKFLOW_RUN_NUMBER"])
          version_name = values.get("versionName", "2.4.3").split("+build.", 1)[0]
          version_code = 100000 + run_number
          min_supported = int(values.get("minSupportedVersionCode", "1"))
          release_notes = values.get("releaseNotes", "Performance improvements and bug fixes.")

          if version_code <= min_supported:
              raise SystemExit("Generated versionCode must be greater than minSupportedVersionCode.")
          values["versionName"] = version_name
          values["versionCode"] = str(version_code)
          values["minSupportedVersionCode"] = str(min_supported)
          values["releaseNotes"] = release_notes
          path.write_text("\n".join(f"{key}={value}" for key, value in values.items()) + "\n")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as out:
              out.write("## Workly India — Android release metadata\n\n")
              out.write("| Detail | Value |\n|---|---|\n")
              out.write(f"| Version name | {version_name} |\n")
              out.write(f"| Version code | {version_code} |\n")
              out.write(f"| Minimum supported version code | {min_supported} |\n")
              out.write(f"| Release notes | {release_notes} |\n\n")
          print(f"Generated v{version_name} (versionCode {version_code}) for workflow run #{run_number}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 9.7.0 and publish a public Build Scan
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Prepare release signing key
        id: release-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKLY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WORKLY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORKLY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORKLY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p "$RUNNER_TEMP/workly-signing"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workly-signing/upload-key.jks"
            echo "WORKLY_RELEASE_READY=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Public release signing secrets are missing. Configure WORKLY_UPLOAD_KEYSTORE_BASE64, WORKLY_UPLOAD_STORE_PASSWORD, WORKLY_UPLOAD_KEY_ALIAS and WORKLY_UPLOAD_KEY_PASSWORD."
            exit 1
          fi

      - name: Sync Android launcher icon from saved Primary Logo
        env:
          SUPABASE_URL: https://jubwzelupbntbetpajqb.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_T8RX2Ow8JaudpytTYl0jZg_aWZeYR2o
        run: |
          python -m pip install --quiet Pillow requests
          python - <<'PY'
          import os
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image

          api = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          headers = {"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json"}
          response = requests.post(f"{api}/rest/v1/rpc/get_brand_assets", headers=headers, json={}, timeout=30)
          response.raise_for_status()
          assets = response.json()
          if isinstance(assets, list):
              assets = assets[0] if assets else {}
          logo_url = assets.get("logo_url") if isinstance(assets, dict) else None
          if not isinstance(logo_url, str) or not logo_url.startswith("https://"):
              raise SystemExit("Saved Brand & Logo Management Primary Logo is missing or is not a public HTTPS image.")
          image_response = requests.get(logo_url, timeout=45)
          image_response.raise_for_status()
          source = Image.open(BytesIO(image_response.content)).convert("RGBA")
          if source.width < 96 or source.height < 96:
              raise SystemExit(f"Primary Logo is too small for an Android launcher icon: {source.size}")
          # Preserve the exact artwork and aspect ratio; fit it on a transparent square
          # so Android launchers can apply their own circular/squircle mask.
          side = max(source.size)
          canvas = Image.new("RGBA", (side, side), (0, 0, 0, 0))
          canvas.alpha_composite(source, ((side - source.width) // 2, (side - source.height) // 2))
          icon = Path("native/android/app/src/main/res/drawable-nodpi/ic_workly_launcher_image.png")
          icon.parent.mkdir(parents=True, exist_ok=True)
          canvas.resize((512, 512), Image.Resampling.LANCZOS).save(icon, format="PNG", optimize=True)
          with Image.open(icon) as check:
              check.verify()
          print(f"Android launcher icon synced from saved Primary Logo: {source.size} -> {icon}")
          PY

      - name: Build signed public release APK and Play Store bundle
        working-directory: native/android
        env:
          WORKLY_UPLOAD_STORE_FILE: ${{ runner.temp }}/workly-signing/upload-key.jks
          WORKLY_UPLOAD_STORE_PASSWORD: ${{ secrets.WORKLY_UPLOAD_STORE_PASSWORD }}
          WORKLY_UPLOAD_KEY_ALIAS: ${{ secrets.WORKLY_UPLOAD_KEY_ALIAS }}
          WORKLY_UPLOAD_KEY_PASSWORD: ${{ secrets.WORKLY_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle assembleWebsiteRelease bundlePlayStoreRelease --stacktrace

      - name: Rename release files for users
        run: |
          set -euo pipefail
          APK_FILE=$(find native/android/app/build/outputs/apk/website/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          AAB_FILE=$(find native/android/app/build/outputs/bundle/playStoreRelease -maxdepth 1 -type f -name '*.aab' -print -quit)
          if [ -z "$APK_FILE" ] || [ -z "$AAB_FILE" ]; then
            echo "::error::Release output missing. APK='$APK_FILE' AAB='$AAB_FILE'"
            find native/android/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p native/android/app/build/outputs
          cp "$APK_FILE" native/android/app/build/outputs/Workly-India.apk
          cp "$AAB_FILE" native/android/app/build/outputs/Workly-India.aab
          test -s native/android/app/build/outputs/Workly-India.apk
          test -s native/android/app/build/outputs/Workly-India.aab

      - name: Upload public release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Workly-India
          path: |
            native/android/app/build/outputs/Workly-India.apk
            native/android/app/build/outputs/Workly-India.aab
          if-no-files-found: error
          retention-days: 30

      - name: Auto-publish APK to Workly release feed
        if: success() && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: https://jubwzelupbntbetpajqb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APK_FILE: native/android/app/build/outputs/Workly-India.apk
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, pathlib
          from datetime import datetime, timezone
          from urllib.parse import quote
          import requests

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
          if not key:
              raise SystemExit("Missing GitHub Actions secret SUPABASE_SERVICE_ROLE_KEY. Add it once in repository Actions secrets.")
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}
          values = {}
          for line in pathlib.Path("android-release.properties").read_text().splitlines():
              if "=" in line and not line.lstrip().startswith("#"):
                  k, v = line.split("=", 1)
                  values[k.strip()] = v.strip()
          code = int(values["versionCode"])
          name = values["versionName"]
          minimum = int(values.get("minSupportedVersionCode", "1"))
          notes = values.get("releaseNotes", "")
          apk = pathlib.Path(os.environ["APK_FILE"])
          if not apk.is_file() or apk.stat().st_size == 0:
              raise SystemExit("Signed APK is missing or empty; refusing to publish.")
          object_path = f"releases/{code}-{os.environ['GITHUB_SHA'][:12]}.apk"
          upload_url = f"{base}/storage/v1/object/android-app-releases/{quote(object_path, safe='/')}"
          with apk.open("rb") as stream:
              uploaded = requests.post(upload_url, headers={**headers, "Content-Type":"application/vnd.android.package-archive", "x-upsert":"true"}, data=stream, timeout=180)
          if uploaded.status_code not in (200, 201):
              raise SystemExit(f"APK upload failed ({uploaded.status_code}): {uploaded.text[:800]}")
          row = {"version_code":code, "version_name":name, "apk_path":object_path, "apk_size_bytes":apk.stat().st_size, "release_notes":notes, "min_supported_version_code":minimum, "is_published":True, "published_at":datetime.now(timezone.utc).isoformat()}
          existing = requests.get(f"{base}/rest/v1/android_app_releases", headers=headers, params={"select":"id","version_code":f"eq.{code}","limit":"1"}, timeout=30)
          existing.raise_for_status()
          rows = existing.json()
          if rows:
              saved = requests.patch(f"{base}/rest/v1/android_app_releases", headers={**headers,"Content-Type":"application/json"}, params={"id":f"eq.{rows[0]['id']}"}, json=row, timeout=30)
          else:
              saved = requests.post(f"{base}/rest/v1/android_app_releases", headers={**headers,"Content-Type":"application/json","Prefer":"return=representation"}, json=row, timeout=30)
          if saved.status_code not in (200, 201, 204):
              raise SystemExit(f"Release publish failed ({saved.status_code}): {saved.text[:800]}")
          retired = requests.patch(f"{base}/rest/v1/android_app_releases", headers={**headers,"Content-Type":"application/json"}, params={"is_published":"eq.true","version_code":f"neq.{code}"}, json={"is_published":False}, timeout=30)
          if retired.status_code not in (200, 204):
              raise SystemExit(f"Could not retire previous releases ({retired.status_code}): {retired.text[:800]}")
          print(f"Published Workly India v{name} (code {code}) to the Android update feed.")
          token_result = requests.get(f"{base}/rest/v1/push_subscriptions", headers=headers, params={"select":"fcm_token","platform":"eq.android","enabled":"eq.true","fcm_token":"not.is.null","limit":"5000"}, timeout=30)
          if token_result.ok:
              tokens = list(dict.fromkeys(x.get("fcm_token") for x in token_result.json() if x.get("fcm_token")))
              for start in range(0, len(tokens), 400):
                  payload = {"action":"send_push_raw","tokens":tokens[start:start+400],"title":f"Workly India update v{name}","message":"New app update is ready. Open Workly India to download and install the latest version.","url":"https://worklyindia.devs.surf/","tag":f"workly-android-update-{code}","data":{"type":"android_app_update","version_code":str(code)}}
                  pushed = requests.post(f"{base}/functions/v1/email-api", headers={**headers,"Content-Type":"application/json"}, json=payload, timeout=60)
                  print(f"Push batch HTTP {pushed.status_code}: {pushed.text[:400]}")
              print(f"Eligible Android push subscriptions: {len(tokens)}")
          else:
              print(f"Push token lookup unavailable ({token_result.status_code}); release is still available in the app update feed.")
          PY

      - name: Add public release summary
        if: always()
        run: |
          {
            echo "## Workly India — Public Android Release"
            echo ""
            printf -- '- **Commit:** `%s`\n\n' "$GITHUB_SHA"
            APK_FILE="native/android/app/build/outputs/Workly-India.apk"
            AAB_FILE="native/android/app/build/outputs/Workly-India.aab"
            if [ -s "$APK_FILE" ] && [ -s "$AAB_FILE" ]; then
              echo "- Signed release APK: generated."
              echo "- Google Play AAB: generated."
              echo "- Uploaded artifact: `Workly-India`."
              echo "- APK size: $(du -h "$APK_FILE" | cut -f1)"
              echo "- AAB size: $(du -h "$AAB_FILE" | cut -f1)"
            else
              echo "::warning::Release files are not available; inspect the earlier build or rename step."
              find native/android/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
