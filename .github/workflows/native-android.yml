name: Native Android
# Rebuild the signed native app whenever Kotlin app/auth sources change.
# Includes mobile login, password recovery and native 2FA verification.

on:
  push:
    paths:
      - "native/android/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 8.9 (compatible with Android Gradle Plugin 8.7.3)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        id: release-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKLY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WORKLY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORKLY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORKLY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p "$RUNNER_TEMP/workly-signing"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workly-signing/upload-key.jks"
            echo "WORKLY_RELEASE_READY=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Public release signing secrets are missing. Configure WORKLY_UPLOAD_KEYSTORE_BASE64, WORKLY_UPLOAD_STORE_PASSWORD, WORKLY_UPLOAD_KEY_ALIAS and WORKLY_UPLOAD_KEY_PASSWORD."
            exit 1
          fi

      - name: Normalize launcher icon PNG
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          icon = Path("native/android/app/src/main/res/drawable-nodpi/ic_workly_launcher_image.png")
          if not icon.is_file():
              raise SystemExit(f"Launcher icon is missing: {icon}")
          # Recover decodable pixels from a truncated PNG without replacing the artwork.
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          with Image.open(icon) as source:
              rgba = source.convert("RGBA")
              if rgba.width < 96 or rgba.height < 96:
                  raise SystemExit(f"Launcher icon dimensions are too small: {rgba.size}")
              rgba.save(icon, format="PNG", optimize=True)
          with Image.open(icon) as check:
              check.verify()
          print(f"Recovered and validated launcher icon: {icon} ({rgba.width}x{rgba.height})")
          PY

      - name: Build signed public release APK and Play Store bundle
        working-directory: native/android
        env:
          WORKLY_UPLOAD_STORE_FILE: ${{ runner.temp }}/workly-signing/upload-key.jks
          WORKLY_UPLOAD_STORE_PASSWORD: ${{ secrets.WORKLY_UPLOAD_STORE_PASSWORD }}
          WORKLY_UPLOAD_KEY_ALIAS: ${{ secrets.WORKLY_UPLOAD_KEY_ALIAS }}
          WORKLY_UPLOAD_KEY_PASSWORD: ${{ secrets.WORKLY_UPLOAD_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Rename release files for users
        run: |
          APK_FILE=$(find native/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          AAB_FILE=$(find native/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)
          test -n "$APK_FILE" && test -n "$AAB_FILE"
          cp "$APK_FILE" native/android/app/build/outputs/Workly-India.apk
          cp "$AAB_FILE" native/android/app/build/outputs/Workly-India.aab

      - name: Upload public release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Workly-India
          path: |
            native/android/app/build/outputs/Workly-India.apk
            native/android/app/build/outputs/Workly-India.aab
          if-no-files-found: error
          retention-days: 30

      - name: Add public release summary
        if: always()
        run: |
          {
            echo "## Workly India — Public Android Release"
            echo ""
            printf -- '- **Commit:** `%s`\\n' "$GITHUB_SHA"
            echo ""
            if [ -f "native/android/app/build/outputs/apk/release/app-release.apk" ] && [ -f "native/android/app/build/outputs/bundle/release/app-release.aab" ]; then
              echo "- Signed release APK: generated."
              echo "- Google Play AAB: generated."
              echo "- Artifact: `workly-india-public-release`"
            else
              echo "::error::Public release outputs were not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
