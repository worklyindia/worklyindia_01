name: Native Android

on:
  push:
    paths:
      - "native/android/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 8.9 (compatible with Android Gradle Plugin 8.7.3)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: native/android
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: workly-india-native-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release signing key
        id: release-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKLY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WORKLY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORKLY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORKLY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p "$RUNNER_TEMP/workly-signing"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workly-signing/upload-key.jks"
            echo "WORKLY_RELEASE_READY=true" >> "$GITHUB_OUTPUT"
          else
            echo "WORKLY_RELEASE_READY=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; skipping signed release APK."
          fi

      - name: Build signed release APK
        if: steps.release-signing.outputs.WORKLY_RELEASE_READY == 'true'
        working-directory: native/android
        env:
          WORKLY_UPLOAD_STORE_FILE: ${{ runner.temp }}/workly-signing/upload-key.jks
          WORKLY_UPLOAD_STORE_PASSWORD: ${{ secrets.WORKLY_UPLOAD_STORE_PASSWORD }}
          WORKLY_UPLOAD_KEY_ALIAS: ${{ secrets.WORKLY_UPLOAD_KEY_ALIAS }}
          WORKLY_UPLOAD_KEY_PASSWORD: ${{ secrets.WORKLY_UPLOAD_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload signed release APK
        if: steps.release-signing.outputs.WORKLY_RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workly-india-native-signed-release-apk
          path: native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add build summary
        if: always()
        run: |
          {
            echo "## Workly India — Native Android Build"
            echo ""
            printf -- '- **Commit:** `%s`\\n' "$GITHUB_SHA"
            echo ""
            if [ -f "native/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "### Debug APK"
              echo "- Debug APK generated successfully."
              echo "- Artifact: `workly-india-native-debug-apk`"
            fi
            if [ -f "native/android/app/build/outputs/apk/release/app-release.apk" ]; then
              echo "### Signed release APK"
              echo "- Signed release APK generated successfully."
              echo "- Artifact: `workly-india-native-signed-release-apk`"
            else
              echo "### Release signing"
              echo "- Signed release APK not generated. Add the four WORKLY_UPLOAD_* repository secrets to enable it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
