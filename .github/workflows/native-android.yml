name: Native Android

on:
  push:
    paths:
      - "native/android/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 8.9 (compatible with Android Gradle Plugin 8.7.3)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: native/android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workly-india-native-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add build summary
        if: always()
        run: |
          {
            echo "## Workly India — Native Android Build"
            echo ""
            echo "- **Commit:** `$GITHUB_SHA`"
            echo ""
            if [ -f "native/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "### APK"
              echo "- Debug APK generated successfully."
              echo "- Artifact name: `workly-india-native-debug-apk`"
              echo "- Download it from this workflow run's **Artifacts** section (available for 14 days)."
            else
              echo "### Build result"
              echo "- APK was not generated. Check the failed step's logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
