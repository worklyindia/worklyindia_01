name: Workly AI Voice Android

on:
  push:
    branches:
      - feature/workly-ai-voice-server-app
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/workly-ai-voice-android.yml"
  pull_request:
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/workly-ai-voice-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build standalone AI Voice APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-ai-voice
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: workly-ai-voice-debug-apk
          path: android-ai-voice/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
