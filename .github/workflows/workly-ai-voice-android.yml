name: Workly Voice Android

on:
  push:
    branches:
      - feature/workly-ai-voice-server-app
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/workly-ai-voice-android.yml"
  pull_request:
    paths:
      - "android-ai-voice/**"
      - ".github/workflows/workly-ai-voice-android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Workly Voice APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and native build tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"

      - name: Build debug APK
        working-directory: android-ai-voice
        run: gradle --no-daemon assembleDebug

      - name: Rename APK for download
        run: cp android-ai-voice/app/build/outputs/apk/debug/app-debug.apk android-ai-voice/app/build/outputs/apk/debug/Workly-Voice-v1.0.0.apk

      - name: Upload Workly Voice APK
        uses: actions/upload-artifact@v7
        with:
          name: Workly-Voice-v1.0.0
          path: android-ai-voice/app/build/outputs/apk/debug/Workly-Voice-v1.0.0.apk
          if-no-files-found: error
          retention-days: 14
