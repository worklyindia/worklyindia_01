name: Workly AI Voice Website Checks
# Validates the authenticated pairing page and its Workly Settings entry point.

on:
  push:
    branches: [feature/workly-ai-voice-server-app]
    paths:
      - "package.json"
      - "src/hooks/**"
      - "src/integrations/supabase/types.ts"
      - "tsconfig.app.json"
      - "src/App.tsx"
      - "src/pages/WorklyAIVoiceDevices.tsx"
      - "src/pages/Settings.tsx"
      - "src/pages/owner-portal/**"
      - "src/lib/nativeAppBridge.ts"
      - ".github/workflows/workly-ai-voice-web-check.yml"
  pull_request:
    paths:
      - "package.json"
      - "src/hooks/**"
      - "src/integrations/supabase/types.ts"
      - "tsconfig.app.json"
      - "src/App.tsx"
      - "src/pages/WorklyAIVoiceDevices.tsx"
      - "src/pages/Settings.tsx"
      - ".github/workflows/workly-ai-voice-web-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check website
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint new pairing page
        run: npx eslint src/pages/WorklyAIVoiceDevices.tsx --max-warnings 0
