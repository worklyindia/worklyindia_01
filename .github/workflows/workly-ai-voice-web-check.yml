name: Workly AI Voice Website Checks

on:
  push:
    branches: [feature/workly-ai-voice-server-app]
    paths:
      - "src/App.tsx"
      - "src/pages/WorklyAIVoiceDevices.tsx"
      - "src/pages/Settings.tsx"
      - ".github/workflows/workly-ai-voice-web-check.yml"
  pull_request:
    paths:
      - "src/App.tsx"
      - "src/pages/WorklyAIVoiceDevices.tsx"
      - ".github/workflows/workly-ai-voice-web-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check website
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint new pairing page
        run: npx eslint src/pages/WorklyAIVoiceDevices.tsx --max-warnings 0
