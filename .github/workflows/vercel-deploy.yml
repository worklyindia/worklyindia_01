name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/functions/**'
      - 'native/android/**'
      - 'android-release.properties'
      - '.github/workflows/native-android.yml'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'supabase/functions/**'
      - 'native/android/**'
      - 'android-release.properties'
      - '.github/workflows/native-android.yml'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

# These are public Vercel resource identifiers, not credentials.
# Keep the access token in GitHub Secrets only.
env:
  VERCEL_ORG_ID: team_sxJ9DY1112UOtdJ3AJxULBzC
  VERCEL_PROJECT_ID: prj_pYQUi0twSlDwyf1axz1j3by85NmI

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Vercel secrets
        id: guard
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "VERCEL_TOKEN is not set — skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.guard.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 24
      - name: Install Vercel CLI
        if: steps.guard.outputs.ok == 'true'
        run: npm install --global vercel@latest
      - name: Pull Vercel settings
        if: steps.guard.outputs.ok == 'true'
        run: vercel pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build
        if: steps.guard.outputs.ok == 'true'
        run: vercel build ${{ github.event_name != 'pull_request' && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        if: steps.guard.outputs.ok == 'true'
        run: |
          url=$(vercel deploy --prebuilt --archive=tgz ${{ github.event_name != 'pull_request' && '--prod' || '' }})
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
